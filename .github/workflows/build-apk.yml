name: Build Zenith '26 Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Gradle Wrapper
        working-directory: ./android
        run: gradle wrapper --gradle-version 8.6

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Report Build Output
        if: always()
        run: |
          if [ -f build.log ]; then
            echo "## 📋 Gradle Build Log (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Rename APK file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Zenith26-Fest-App.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zenith26-Android-APK
          path: Zenith26-Fest-App.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Zenith '26 Mobile App v1.0.0 (APK)"
          body: |
            ## 📱 Zenith '26 College Fest Management System — Mobile APK
            
            This is the official native Android APK built from Kotlin & Jetpack Compose.
            
            - **Cloud Backend:** Connected to [https://zenithcollegefest.vercel.app/](https://zenithcollegefest.vercel.app/)
            - **Architecture:** Clean MVVM, Material3, Retrofit 2, Coroutines & StateFlow
            - **Features:** 14 events explorer, live seat counter, student registration modal, admin dashboard with live utilization metrics.
            
            ### 📥 Download and Install:
            Download **Zenith26-Fest-App.apk** below and open on your Android phone or Appetize.io to run!
          files: Zenith26-Fest-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
